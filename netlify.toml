[build]
  command = "npm run build"
  publish = "dist"

# SPA routing: todas las rutas van al index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Headers de seguridad y privacidad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "no-referrer"
    # Cache largo para assets con hash
    Cache-Control          = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"  # HTML siempre fresco
